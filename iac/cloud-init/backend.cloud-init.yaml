#cloud-config
# ==============================================================================
# Cloud-Init: Nodo Backend (NestJS API - Capa Privada)
# ==============================================================================
hostname: ${tenant_id}-backend
fqdn: ${tenant_id}-backend.local
manage_etc_hosts: true

users:
  - default
  - name: ubuntu
    gecos: Ubuntu Operator
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: sudo
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ${ssh_public_key}

package_update: true
packages:
  - python3
  - python3-apt
  - curl
  - jq

runcmd:
  - echo "[Cloud-Init] Backend node initialized successfully" > /var/log/cloud-init-status.log
